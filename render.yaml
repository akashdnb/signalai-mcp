services:
  - type: web
    name: signalai-mcp
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn signalai_mcp.server:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: SIGNALAI_PUBLIC_URL
        sync: false
      - key: SIGNALAI_AUTH_ISSUER_URL
        sync: false
      - key: SIGNALAI_AUTH_INTROSPECTION_URL
        sync: false
      - key: SIGNALAI_AUTH_CLIENT_ID
        sync: false
      - key: SIGNALAI_AUTH_CLIENT_SECRET
        sync: false
      - key: SIGNALAI_AUTH_TOKENS
        sync: false
      - key: SIGNALAI_CAPABILITY_BASE_URL
        sync: false
      - key: SIGNALAI_SERVICE_TOKEN
        sync: false
      - key: SIGNALAI_ALLOWED_HOSTS
        sync: false
      - key: SIGNALAI_ALLOWED_ORIGINS
        sync: false
